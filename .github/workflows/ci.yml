name: ci
on:
  pull_request:
  push:
    branches: [phase2-site]
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # Call the tools directly (not via package.json scripts) so the gate cannot be weakened by editing scripts.
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx tsc -p tsconfig.tools.json --noEmit
      - run: npx tsc -p tsconfig.runtime.json --noEmit
      - run: npx vitest run
      - run: npx tsx scripts/lint-templates.ts
  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    env:
      PUBLIC_INDEXABLE: 'false'
      PUBLIC_BRN: ${{ vars.BRN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  migrations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      # pull_request: diff against the base branch (existing migrations immutable; added ones additive-only).
      # push: additive-only check over every file in worker/migrations/.
      - run: node .github/scripts/migrations-lint.mjs
  # The guard and migrations-lint that judge a pull request come from its BASE commit (checked out into _base), so a
  # pull request cannot weaken the checks that review it; they read the pull request's tree through GUARD_ROOT. The
  # pull request's own guard also runs (self-test and enforce), so a guard change is tested before it becomes the base.
  # On push (already reviewed and merged) base and head are the same commit.
  workflow-guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GUARD_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: _base
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --prefix _base/.github/scripts
      - run: npm ci --ignore-scripts --prefix .github/scripts
      # ENFORCE mode, base commit's guard over this tree: any violation fails this job (and blocks merge once
      # workflow-guard is a required check).
      - run: node _base/.github/scripts/workflow-guard.mjs --mode=enforce
      - run: node _base/.github/scripts/migrations-lint.mjs
      # This tree's guard: its self-test (a failure fails the job in any mode), then the same enforce run.
      - run: node .github/scripts/workflow-guard.mjs --self-test
      - run: node .github/scripts/workflow-guard.mjs --mode=enforce
