name: ci
on:
  pull_request:
  push:
    branches: [phase2-site]
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # Call the tools directly (not via package.json scripts) so the gate cannot be weakened by editing scripts.
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx tsc -p tsconfig.tools.json --noEmit
      - run: npx tsc -p tsconfig.runtime.json --noEmit
      - run: npx vitest run
      - run: npx tsx scripts/lint-templates.ts
  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    env:
      PUBLIC_INDEXABLE: 'false'
      PUBLIC_BRN: ${{ vars.BRN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  migrations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      # pull_request: diff against the base branch (existing migrations immutable; added ones additive-only).
      # push: additive-only check over every file in worker/migrations/.
      - run: node .github/scripts/migrations-lint.mjs
  workflow-guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --prefix .github/scripts
      # A self-test failure fails the job in any mode.
      - run: node .github/scripts/workflow-guard.mjs --self-test
      # ENFORCE mode: any violation fails this job (and blocks merge once workflow-guard is a required check).
      - run: node .github/scripts/workflow-guard.mjs --mode=enforce
