# as: uptime.yml
name: uptime
# Uptime monitor (audit item 31, Coordinator 2026-10-18). Every 30 minutes on a GitHub-hosted runner, with no secrets and
# read-only permissions. Targets come from ONE file, .github/uptime-targets.json (staging now; the go-live brief swaps
# them to the domain). Each check makes up to 3 attempts with a 10 s timeout:
#   site root 200; Worker /health 200; Worker /market/status: the newest DLD write is at most 8 days old.
# A null or unreadable /market/status is unknown, not stale (the Worker returns nulls on a transient D1 read error):
# it is read again after 60 s, and fails only if it is unknown twice or a real timestamp is older than 8 days (the same
# rule as market-data-sync's Stale-data check). A failed check fails the job, so GitHub emails the owner.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/uptime-targets.json
          sparse-checkout-cone-mode: false
      - name: Read targets
        run: |
          f=.github/uptime-targets.json
          for k in site worker_health market_status; do
            u=$(jq -er --arg k "$k" '.[$k]' "$f") || { echo "uptime-targets.json: $k is missing"; exit 1; }
            [[ "$u" =~ ^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._/-]*)?$ ]] || { echo "uptime-targets.json: $k is not a plain https URL"; exit 1; }
            echo "${k^^}_URL=$u" >> "$GITHUB_ENV"
          done
      - name: Site root returns 200
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$SITE_URL") || code=000
            echo "attempt $i: $SITE_URL -> $code"
            [ "$code" = 200 ] && exit 0
            [ "$i" = 3 ] || sleep 5
          done
          echo "::error title=Site down::$SITE_URL did not return 200 in 3 attempts"; exit 1
      - name: Worker /health returns 200
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$WORKER_HEALTH_URL") || code=000
            echo "attempt $i: $WORKER_HEALTH_URL -> $code"
            [ "$code" = 200 ] && exit 0
            [ "$i" = 3 ] || sleep 5
          done
          echo "::error title=Worker down::$WORKER_HEALTH_URL did not return 200 in 3 attempts"; exit 1
      - name: Market data at most 8 days old
        run: |
          # Prints the DLD timestamp, or nothing when the answer is unknown (unreachable, not JSON, or null).
          read_dld() {
            local b i
            for i in 1 2 3; do
              if b=$(curl -sS -f --max-time 10 -H 'cache-control: no-cache' "$MARKET_STATUS_URL"); then
                jq -r '.dld_synced_at // empty' <<<"$b" 2>/dev/null || true
                return 0
              fi
              [ "$i" = 3 ] || sleep 5
            done
          }
          last=$(read_dld)
          if [ -z "$last" ]; then
            echo "unknown on the first read; reading again in 60 s"
            sleep 60
            last=$(read_dld)
          fi
          [ -n "$last" ] || { echo "::error title=Market status unknown::$MARKET_STATUS_URL gave no DLD timestamp on two reads 60 s apart"; exit 1; }
          ts=$(date -u -d "$last" +%s) || { echo "::error title=Market status invalid::unreadable timestamp: $last"; exit 1; }
          age=$(( ( $(date -u +%s) - ts ) / 3600 ))
          echo "newest DLD write: $last (${age} h old)"
          [ "$age" -le 192 ] || { echo "::error title=Market data stale::the newest DLD write is $last, older than 8 days"; exit 1; }
