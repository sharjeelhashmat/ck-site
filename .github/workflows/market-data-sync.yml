name: market-data-sync
# Daily market-data sync (owner EXECUTE 2026-10-11; guard exception 2026-10-16). Downloads the public DLD open-data CSVs
# and the ADREC year-to-date feed, aggregates them on the runner, and writes ONLY aggregates to D1 (ck-leads) through one
# fixed SQL file. No project or developer names, no raw rows, no secrets or signed URLs in the logs.
# Runs in the "market-data" environment with a D1-only token (CF_D1_TOKEN); the deploy token is never used here.
# Any failure (download, sanity guard, ADREC) is recorded in D1 and then fails the "Check" step, so GitHub emails the owner.
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-data-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/phase2-site'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: market-data
    defaults:
      run:
        shell: bash
        working-directory: worker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Assert wrangler 4.124.0
        run: |
          v=$(npx --no-install wrangler --version | tr -d '[:space:]')
          [ "$v" = "4.124.0" ] || { echo "expected 4.124.0, got: $v"; exit 1; }
          echo "version ok: $v"
      # Preflight: fail closed, never print secret values.
      - name: Preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "CF_D1_TOKEN is not set in the market-data environment"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "CLOUDFLARE_ACCOUNT_ID is not set in the market-data environment"; exit 1; }
          [ "$CLOUDFLARE_ACCOUNT_ID" = "6ae55501743fe5c0e6dc33be902cbace" ] || { echo "CLOUDFLARE_ACCOUNT_ID is not the reviewed account"; exit 1; }
          for line in 'database_name = "ck-leads"' 'database_id = "20b1180d-b390-4d59-9334-cb536a378147"'; do
            [ "$(grep -cFx -- "$line" wrangler.toml)" = "1" ] || { echo "wrangler.toml must contain exactly once: $line"; exit 1; }
          done
          echo "preflight ok"
      # Download and aggregate. No credentials in this step. Always writes market-sync.sql: the data, or a failure record.
      - name: Build SQL
        run: npx --no-install tsx scripts/market-sync/sync.ts build --sql market-sync.sql --state market-sync.state.json
      - name: Apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --no-install wrangler d1 execute ck-leads --remote --file market-sync.sql
      # Fails (and so fails the job) when this run's row in market_sync_runs is not ok, or is missing.
      - name: Write check SQL
        run: npx --no-install tsx scripts/market-sync/sync.ts check --sql market-sync.sql --state market-sync.state.json
      - name: Check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --no-install wrangler d1 execute ck-leads --remote --file market-sync.sql
