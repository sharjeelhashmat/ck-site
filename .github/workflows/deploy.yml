name: deploy-worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**']
permissions:
  contents: read
concurrency:
  group: deploy-worker
  cancel-in-progress: false
jobs:
  deploy:
    # Kill switch: set repository variable AUTONOMY=off to stop automatic deploys. Manual runs still work.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTONOMY != 'off' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # Call the tools directly (not via package.json scripts) so the gate cannot be weakened by editing scripts.
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx tsc -p tsconfig.tools.json --noEmit
      - run: npx tsc -p tsconfig.runtime.json --noEmit
      - run: npx vitest run
      - run: npx tsx scripts/lint-templates.ts
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
      - name: Deploy Worker
        id: deploy
        run: npx wrangler deploy
      - name: Apply D1 migrations (additive only)
        run: npx wrangler d1 migrations apply ck-leads --remote
      - name: Post-deploy smoke test
        run: |
          URL=$(grep -E '^WORKER_URL' wrangler.toml | sed -E 's/^WORKER_URL[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          test -n "$URL" || { echo "WORKER_URL is empty in wrangler.toml; a smoke test is required"; exit 1; }
          echo "Smoke testing $URL"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$URL/health" || true)
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/health.json; then echo "healthy"; exit 0; fi
            sleep 5
          done
          echo "smoke test failed"; exit 1
      - name: Roll back if the smoke test failed
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        run: |
          npx wrangler rollback --message "auto-rollback after failed smoke test" || true
