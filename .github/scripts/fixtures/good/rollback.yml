# as: rollback.yml
name: rollback
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [ck-lead-worker, ck-site-web]
permissions:
  contents: read
jobs:
  rollback-worker:
    if: ${{ github.ref == 'refs/heads/phase2-site' && inputs.target == 'ck-lead-worker' }}
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: prod-ck-lead-worker
      cancel-in-progress: false
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: npm ci
      - run: npx --no-install wrangler --version
      - run: npx --no-install wrangler rollback --name ck-lead-worker --message "owner rollback" --yes
  rollback-site:
    if: ${{ github.ref == 'refs/heads/phase2-site' && inputs.target == 'ck-site-web' }}
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: prod-ck-site-web
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: npm ci
      - run: npx --no-install wrangler rollback --name=ck-site-web --message "owner rollback" --yes
