# as: deploy.yml
name: deploy-worker
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prod-ck-lead-worker
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/phase2-site' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npx --no-install wrangler deploy
      - name: Smoke test
        run: curl -fsS https://example.invalid/health
      - name: Report failure
        if: ${{ failure() }}
        run: echo "deploy failed; use rollback.yml"
