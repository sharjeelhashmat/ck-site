# as: ci.yml
# expect: R6
name: ci
on:
  pull_request:
  push:
    branches: [phase2-site]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65
      - uses: docker://alpine:3
