# as: deploy.yml
# expect: R4
name: deploy-worker
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: prod-ck-lead-worker
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/phase2-site'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - run: echo deploy
  notify:
    runs-on: ubuntu-24.04
    steps:
      - run: 'curl -H "Authorization: ${{ secrets.CLOUDFLARE_API_TOKEN }}" https://example.invalid'
