# as: deploy-site.yml
# expect: R18
# The refusal step is there but runs after the build, so a noindex build is already made when it fails.
name: deploy-site
on: workflow_dispatch
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/phase2-site'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://example.invalid
    concurrency:
      group: prod-ck-site-web
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci && npm run build
      - name: Refuse noindex deploy
        working-directory: .
        env:
          PUBLIC: ${{ inputs.public }}
        run: |
          if [ "$PUBLIC" != "true" ]; then
            echo "::error::Tick Public to deploy the live site."
            exit 1
          fi
      - run: npx --no-install wrangler deploy
