# as: docs-lint.yml
# expect: R2
# Any other workflow: no secrets, no environment, pinned actions.
name: docs-lint
on:
  pull_request:
    paths: ['site/**']
  issue_comment:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "${{ github.ref }} ${{ vars.BRN }}"
