<div class="chart"><h2>{{&title_html}}</h2><div class="per">{{period}}</div>
{{#areas}}<div class="area"><div class="an">{{name}}</div><div class="ad">DLD: {{dld}}</div>
<div class="row"><span class="yr">{{now_year}}</span><div class="bar now" style="width:{{now_w}}px"></div><span class="v">{{now_text}}</span><span class="chg{{&chg_class}}">{{change_text}}</span></div>
<div class="row"><span class="yr before">{{before_year}}</span><div class="bar before" style="width:{{before_w}}px"></div><span class="v">{{before_text}}</span></div></div>{{/areas}}</div>
<div class="srcl">{{source}}</div>
