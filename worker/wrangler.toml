# Secrets are never in this file. Set in Cloudflare (Worker > Settings > Variables and Secrets):
#   TURNSTILE_SECRET, RESEND_API_KEY (or BREVO_API_KEY if EMAIL_PROVIDER="brevo"), UNSUB_SECRET, ALERT_EMAIL, and optionally SCORING_JSON (private weights)
# Non-secret variables below are owner-controlled (this file is a CODEOWNERS-protected path).
name = "ck-lead-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# D1 and KV were created in the owner's Cloudflare account on 2026-09-19; their IDs are pinned here so deploys never
# create duplicates. Resource IDs are identifiers, not secrets.
[[d1_databases]]
binding = "DB"
database_name = "ck-leads"
database_id = "20b1180d-b390-4d59-9334-cb536a378147"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "1201e75e1ed84ddeaeb756756cf86898"

[vars]
OUTBOUND = "off"                      # stays off until the go-live checklist is complete
EMAIL_PROVIDER = "resend"             # "resend" (default choice) or "brevo"; secrets: RESEND_API_KEY / BREVO_API_KEY
BRN = ""                              # pending: owner to supply before go-live
AFFILIATION = "Royals Field Properties"
SITE_URL = "https://sharjeelhashmat.com"
WORKER_URL = "https://ck-lead-worker.sharjeelhashmat.workers.dev"   # workers.dev subdomain registered 2026-09-19
BOOKING_URL = ""
# Automated senders live on subdomains only. The root domain is for human mail.
FROM_LEADS_EMAIL = "hello@mail.sharjeelhashmat.com"
FROM_LEADS_NAME = "Sharjeel Hashmat"
FROM_ALERTS_EMAIL = "alerts@mail.sharjeelhashmat.com"
FROM_ALERTS_NAME = "Lead desk"
FROM_NEWS_EMAIL = "brief@news.sharjeelhashmat.com"   # reserved: not used until the opt-in newsletter launches
FROM_NEWS_NAME = "The Investor's Brief"
REPLY_TO = "hello@sharjeelhashmat.com"
MAILBOX_CONFIRMED = "yes"             # confirmed 2026-09-19: outbound test from hello@ passed SPF, DKIM and DMARC in Gmail
SLA_HOURS = "24"
DAILY_SEND_CAP = "45"                  # replies only; each valid lead also triggers 1 owner alert, and Resend free allows 100 sends/day
