# Secrets are never in this file. Set in Cloudflare (Worker > Settings > Variables and Secrets):
#   TURNSTILE_SECRET, RESEND_API_KEY (or BREVO_API_KEY if EMAIL_PROVIDER="brevo"), UNSUB_SECRET, ALERT_EMAIL, and optionally SCORING_JSON (private weights)
# Non-secret variables below are owner-controlled (this file is a CODEOWNERS-protected path).
name = "ck-lead-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# D1 and KV were created in the owner's Cloudflare account on 2026-09-19; their IDs are pinned here so deploys never
# create duplicates. Resource IDs are identifiers, not secrets.
[[d1_databases]]
binding = "DB"
database_name = "ck-leads"
database_id = "20b1180d-b390-4d59-9334-cb536a378147"
migrations_dir = "migrations"

# Daily data retention at 01:17 UTC (src/retention.ts; audit B4, owner decision 2026-10-17).
[triggers]
crons = ["17 1 * * *"]

# Workers Logs (audit F8; free plan: 200,000 events a day, all kept). Only the Worker's own console lines are stored:
# invocation logs (which carry each request's URL and headers) are off, and query strings are redacted anyway (links
# from before PR 2c item 8a carry the address, ?e=; current ones carry an opaque token). Every console call logs fixed text, counts or a redacted error message,
# never a request body, email, phone or name (test/wrangler-config.test.ts).
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
invocation_logs = false

# Per-IP rate limits (PR 2c item 4b, gap G05): the Workers Rate Limiting binding, per minute (period 60). Keys are
# "<route>:<sha256 of the IP>" (src/ratelimit.ts). /health and preflights are not limited. Counts are per Cloudflare
# location and approximate; Turnstile stays the gate on the forms.
[[ratelimits]]
name = "RL_FORMS"                     # POST /lead, /profile, /api/newsletter/subscribe: 5 a minute each
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_UNSUB"                     # GET and POST /unsubscribe and /api/newsletter/unsubscribe: 20 a minute each
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_FEEDBACK"                  # POST /api/newsletter/unsubscribe/feedback: 10 a minute
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_READ"                      # every other GET (the /market routes): 60 a minute
namespace_id = "1004"
simple = { limit = 60, period = 60 }

[[kv_namespaces]]
binding = "KV"
id = "1201e75e1ed84ddeaeb756756cf86898"

[vars]
# One switch per channel (PR 2c item 5). Replies and the newsletter stay off until the go-live checklist is complete;
# owner alerts are on (they were never gated). The go-live checks (BRN, AGENCY_ORN, affiliation, booking, senders) gate replies and
# the newsletter only. The old single OUTBOUND is no longer set; the Worker reads it for one release only when a
# channel switch is missing, and logs a deprecation line.
OUTBOUND_REPLIES = "off"              # replies to leads (approved templates only)
OUTBOUND_NEWSLETTER = "off"           # the newsletter welcome
OUTBOUND_ALERTS = "on"                # owner alerts (lead, investor profile)
EMAIL_PROVIDER = "resend"             # "resend" (default choice) or "brevo"; secrets: RESEND_API_KEY / BREVO_API_KEY
BRN = ""                              # pending: the broker's own BRN (RERA broker card number), owner to supply before go-live
AGENCY_ORN = ""                       # pending: the agency's ORN (RERA Office Registration Number), owner to supply before go-live
AFFILIATION = ""
LEAD_STRICT = "false"                 # Package B: "true" makes a valid phone required on /lead. Keep "false" until the domain cutover.
SITE_URL = "https://sharjeelhashmat.com"
STAGING_ORIGIN = "https://ck-site-staging.sharjeelhashmat.workers.dev"   # the staging Worker ck-site-staging (previews); every enquiry from it is stored quarantined as TEST, never sent or alerted. "" disables it.
WORKER_URL = "https://ck-lead-worker.sharjeelhashmat.workers.dev"   # workers.dev subdomain registered 2026-09-19
BOOKING_URL = ""
# Automated senders live on subdomains only. The root domain is for human mail.
FROM_LEADS_EMAIL = "hello@mail.sharjeelhashmat.com"
FROM_LEADS_NAME = "Sharjeel Hashmat"
FROM_ALERTS_EMAIL = "alerts@mail.sharjeelhashmat.com"
FROM_ALERTS_NAME = "Lead desk"
FROM_NEWS_EMAIL = "brief@news.sharjeelhashmat.com"   # reserved: not used until the opt-in newsletter launches
FROM_NEWS_NAME = "The Compass Key Monthly"
REPLY_TO = "hello@sharjeelhashmat.com"
MAILBOX_CONFIRMED = "yes"             # confirmed 2026-09-19: outbound test from hello@ passed SPF, DKIM and DMARC in Gmail
SLA_HOURS = "24"
DAILY_SEND_CAP = "45"                  # replies only; each valid lead also triggers 1 owner alert, and Resend free allows 100 sends/day
